name: Push

on:
    - push
    - workflow_dispatch

jobs:
    build-test:
        name: Build & Test
        runs-on: ubuntu-26.04
        strategy:
            matrix:
                node: ["22.12.0", "22", "24.11.0", "24", "26.13.0", "26"]

        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  check-latest: ${{ !contains(matrix.node, '.') }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Test
              run: npm test

    lint:
        name: Lint
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint

    release-please:
        name: Release Please
        runs-on: ubuntu-26.04
        needs: [build-test, lint]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: write
            issues: write
            pull-requests: write
            actions: write
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release

            # Run npm publishing on the release tag so provenance uses the exact source commit.
            - name: Start npm publishing
              if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
              run: gh workflow run push.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

    publish-npm:
        name: Publish to npm
        runs-on: ubuntu-26.04
        needs: [build-test, lint]
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Verify the tag has a stable GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease |
                      jq -e '.isDraft == false and .isPrerelease == false'

            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.22.3"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci
            - name: Publish to npm
              run: npm publish

    examples:
        name: Examples
        if: github.event_name == 'push'
        runs-on: ubuntu-26.04

        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - name: Install dependencies (examples/browser)
              run: npm ci
              working-directory: examples/browser
            - name: Build (examples/browser)
              run: npm run build
              working-directory: examples/browser

            - name: Install dependencies (examples/sveltekit)
              run: npm ci
              working-directory: examples/sveltekit
            - name: Check & Build (examples/sveltekit)
              run: npm run check && npm run build
              working-directory: examples/sveltekit
