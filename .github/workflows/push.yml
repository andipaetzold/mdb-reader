name: Push

on:
    - push

jobs:
    build-test:
        name: Build & Test
        runs-on: ubuntu-22.04
        strategy:
            matrix:
                node: ["18.0.0", "18", "20.0.0", "20", "22.11.0", "22", "24.11.0", "24", "26.13.0", "26"]

        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Test
              run: npm test

    release-please:
        name: Release Please
        runs-on: ubuntu-22.04
        needs: build-test
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 2
                  persist-credentials: false

            - name: Check for a pending release at this commit
              id: release_gate
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  manifest=.release-please-manifest.json
                  read_version() {
                      if git cat-file -e "$1:$manifest" 2>/dev/null; then
                          if ! git show "$1:$manifest" | jq -ers 'select(length == 1) | .[0]["."] | strings | select(length > 0)'; then
                              echo "::error::Invalid root release version in $1:$manifest" >&2
                              return 1
                          fi
                      fi
                  }

                  previous_version=$(read_version HEAD^)
                  current_version=$(read_version HEAD)
                  release_eligible=false
                  if [[ -n "$previous_version" && -n "$current_version" && "$previous_version" != "$current_version" ]]; then
                      # The Node strategy includes the package name in the PR branch even when tags omit it.
                      release_eligible=$(
                          gh api --method GET --paginate "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
                              jq -s --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
                                  any(.[][];
                                      .merge_commit_sha == $sha and .merged_at != null and
                                      .base.repo.full_name == $repo and .base.ref == "main" and
                                      .head.repo.full_name == $repo and
                                      .head.ref == "release-please--branches--main--components--mdb-reader" and
                                      any(.labels[]?; .name == "autorelease: pending")
                                  )'
                      )
                  fi
                  echo "release_eligible=$release_eligible" >> "$GITHUB_OUTPUT"

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  target-branch: main
                  skip-github-release: ${{ steps.release_gate.outputs.release_eligible != 'true' }}
                  skip-github-pull-request: ${{ steps.release_gate.outputs.release_eligible == 'true' }}

    update-next-release-preview:
        name: Update Next Release Preview
        runs-on: ubuntu-22.04
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            # A push can skip its preview update while the previous release is still pending.
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  target-branch: main
                  skip-github-release: true

    publish-npm:
        name: Publish to npm
        runs-on: ubuntu-22.04
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: "^24.11.0" # Node 24.11.0 includes npm 11.6.1.
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Verify tagged source commit
              shell: bash
              run: |
                  tag_sha=$(git rev-parse HEAD)
                  if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                      echo "::error::Release tag points to $tag_sha, expected workflow commit $GITHUB_SHA"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci
            - name: Publish to npm
              run: npm publish

    examples:
        name: Examples
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v7
              with:
                  cache: "npm"

            - name: Install dependencies (examples/browser)
              run: npm ci
              working-directory: examples/browser
            - name: Build (examples/browser)
              run: npm run build
              working-directory: examples/browser

            - name: Install dependencies (examples/sveltekit)
              run: npm ci
              working-directory: examples/sveltekit
            - name: Check & Build (examples/sveltekit)
              run: npm run check && npm run build
              working-directory: examples/sveltekit
